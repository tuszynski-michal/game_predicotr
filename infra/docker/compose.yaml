name: game-predictor

services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GAME_PREDICTOR_POSTGRES_USER:-game_predictor}
      POSTGRES_PASSWORD: ${GAME_PREDICTOR_POSTGRES_PASSWORD:-game_predictor_local}
      POSTGRES_DB: ${GAME_PREDICTOR_POSTGRES_DB:-game_predictor}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:${GAME_PREDICTOR_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    shm_size: 128mb
    volumes:
      - game_predictor_postgres_data:/var/lib/postgresql

volumes:
  game_predictor_postgres_data:

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "game-predictor-local-services"
version = "0.1.0"
description = "Local administrative API and snapshot tooling for Game Predictor"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "numpy==2.4.6",
  "onnx==1.22.0",
  "onnxruntime==1.28.0",
  "onnxscript==0.7.1",
  "opencv-python-headless==4.13.0.92",
  "paddlepaddle==3.3.1",
  "Pillow==12.3.0",
  "psycopg[binary]==3.3.4",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.51",
  "torch==2.12.1",
  "torchvision==0.27.1",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.setuptools.packages.find]
where = ["services/api/src", "services/worker/src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["services/api/src", "services/worker/src", "services/test_support"]
testpaths = ["services/api/tests", "services/worker/tests"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["services/api/src", "services/worker/src", "."]
# Map files to modules from explicit bases so scripts/*.py are checked once, as
# "scripts.<name>" (the name their sibling scripts import), not also as "<name>".
namespace_packages = true
explicit_package_bases = true

# Scripts run as `python scripts/<name>.py`, so sys.path[0] is scripts/ and they
# import their siblings by bare name. mypy maps every file under scripts/ to
# `scripts.<name>` (see explicit_package_bases), so those bare names cannot
# resolve; the siblings are still type-checked as their own scripts.
[[tool.mypy.overrides]]
module = [
  "remote_manual_selection_rollout_stage_two",
  "run_middle_row_range_ocr_v4_acceptance",
  "run_v20_layout_import",
  "vision_lab_export",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "onnx",
  "onnx.*",
  "onnx_ir",
  "onnx_ir.*",
  "onnxruntime",
  "onnxruntime.*",
  "onnxscript",
  "onnxscript.*",
  "torch.onnx",
  "torch.onnx.*",
]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

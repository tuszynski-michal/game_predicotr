<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Podgląd propozycji symboli</title>
<style>
:root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff;
  --line: #d8d8d2; --accent: #1f6f4a; --warn: #9a5b00; --bar: #cfe3d8; --same: #e9e9e4; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --fg: #ecece8; --muted: #a3a39c; --card: #212120;
    --line: #3a3a37; --accent: #5fc28f; --warn: #e0a24a; --bar: #2c4a3a; --same: #2d2d2b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 24px 0 8px; }
.muted { color: var(--muted); font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--accent); outline: 2px solid var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.barcell { width: 45%; }
.bar { height: 12px; background: var(--bar); border-radius: 3px; }
tr.same td { background: var(--same); }
tr.review td:first-child { color: var(--warn); }
tr.clickable { cursor: pointer; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.tile .images { display: flex; gap: 8px; }
.tile img { display: block; border: 1px solid var(--line); image-rendering: pixelated; }
.tile .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.scroll { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="muted" id="subtitle"></p>
  <div class="tabs" id="bands" role="group" aria-label="Pasmo pewności modelu"></div>
  <section class="card scroll">
    <h2 style="margin-top:0" id="tableTitle"></h2>
    <table>
      <thead><tr><th>Propozycja biblioteki</th><th class="num">Komórki</th>
        <th class="num">Udział</th><th class="barcell"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted">Kliknij wiersz, aby zobaczyć przykłady. Wiersz wyszarzony: biblioteka
      potwierdza predykcję modelu. „Do przeglądu”: brak jednomyślności 7/7 w obu opisach.</p>
  </section>
  <h2 id="galleryTitle"></h2>
  <p class="muted" id="galleryNote"></p>
  <div class="gallery" id="gallery"></div>
</main>
<script>
const DATA = __PAYLOAD__;
const byId = (id) => document.getElementById(id);
const bands = Object.keys(DATA.summary);
let band = bands[0];
let proposal = null;
byId("title").textContent = "Podgląd propozycji: " + DATA.title;
const total = bands.reduce((sum, b) => sum + Object.values(DATA.summary[b]).reduce((a, v) => a + v, 0), 0);
function name(code) { return DATA.names[code] || code; }
const outside = Object.entries(DATA.notInScope).map(([k, v]) => k + ": " + v).join(", ");
byId("subtitle").textContent = "Oczekujące komórki z predykcją modelu: " + name(DATA.predicted)
  + " · " + total + " komórek · biblioteka " + DATA.library + " wzorców (" + DATA.policy + ")"
  + (outside ? " · poza podglądem (flagi, tryb, widoczność): " + outside : "")
  + " · nic nie zostało zapisane w bazie · raport " + DATA.reportSha256.slice(0, 12);
function renderBands() {
  const box = byId("bands");
  box.textContent = "";
  bands.forEach((b) => {
    const button = document.createElement("button");
    const count = Object.values(DATA.summary[b]).reduce((a, v) => a + v, 0);
    button.textContent = "Pewność modelu " + b + " (" + count + ")";
    button.setAttribute("aria-pressed", String(b === band));
    button.addEventListener("click", () => { band = b; proposal = null; render(); });
    box.appendChild(button);
  });
}
function renderTable() {
  const values = DATA.summary[band];
  const count = Object.values(values).reduce((a, v) => a + v, 0);
  byId("tableTitle").textContent = "Na co biblioteka zmienia predykcję (" + band + ", " + count + " komórek)";
  const body = byId("rows");
  body.textContent = "";
  const entries = Object.entries(values).sort((a, b) => b[1] - a[1]);
  entries.forEach(([code, n]) => {
    const row = document.createElement("tr");
    row.className = "clickable";
    if (code === DATA.predicted) row.classList.add("same");
    if (code === "DO_PRZEGLADU") row.classList.add("review");
    const share = n / count;
    const label = document.createElement("td");
    label.textContent = (code === DATA.predicted ? "bez zmiany: " : "→ ") + name(code);
    const cells = document.createElement("td"); cells.className = "num"; cells.textContent = n;
    const pct = document.createElement("td"); pct.className = "num";
    pct.textContent = (share * 100).toFixed(1).replace(".", ",") + "%";
    const barCell = document.createElement("td"); barCell.className = "barcell";
    const bar = document.createElement("div"); bar.className = "bar";
    bar.style.width = Math.max(1, share * 100) + "%";
    barCell.appendChild(bar);
    row.append(label, cells, pct, barCell);
    row.addEventListener("click", () => { proposal = code; renderGallery(); });
    body.appendChild(row);
  });
  if (!proposal) proposal = entries.find(([code]) => code !== DATA.predicted)?.[0]
    || entries[0][0];
}
function renderGallery() {
  const group = DATA.groups.find((g) => g.band === band && g.proposal === proposal);
  const count = DATA.summary[band][proposal] || 0;
  byId("galleryTitle").textContent = "Przykłady: " + name(DATA.predicted) + " → " + name(proposal)
    + " (" + band + ")";
  byId("galleryNote").textContent = group
    ? "Pokazano " + group.ids.length + " z " + count + " komórek (stała, pseudolosowa kolejność). "
      + "Lewy obraz: wycinek; prawy: położenie na planszy."
    : "Brak komórek.";
  const box = byId("gallery");
  box.textContent = "";
  (group ? group.ids : []).forEach((id) => {
    const t = DATA.thumbnails[id];
    const tile = document.createElement("div"); tile.className = "tile";
    const images = document.createElement("div"); images.className = "images";
    const crop = document.createElement("img"); crop.src = t.crop; crop.width = 96; crop.height = 96;
    crop.alt = "Wycinek";
    const context = document.createElement("img"); context.src = t.context; context.width = 144;
    context.height = 144; context.alt = "Położenie na planszy";
    images.append(crop, context);
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = "model " + t.confidence + " · głosy kształt/łączony " + t.votes
      + (proposal === "DO_PRZEGLADU" ? " · podpowiedź: " + t.hint : "")
      + " · " + id.slice(0, 8);
    tile.append(images, meta);
    box.appendChild(tile);
  });
}
function render() { renderBands(); renderTable(); renderGallery(); }
render();
</script>
</body>
</html>
